name: TMP fetch demo video
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download demos
        run: |
          set -e
          mkdir -p out
          for spec in "cdngdev 2097339677128982873 golden_gate_SO101" "_wenlixiao 2097801944119349455 physical_ICL"; do
            set -- $spec; user=$1; id=$2; name=$3
            url=$(python3 -c "import urllib.request,json,sys;d=json.load(urllib.request.urlopen('https://api.fxtwitter.com/'+sys.argv[1]+'/status/'+sys.argv[2],timeout=30));t=d.get('tweet',d);v=(t.get('media') or {}).get('videos') or [];print(v[0]['url'] if v else '')" "$user" "$id")
            echo "[$name] url=$url"
            if [ -n "$url" ]; then curl -sL --max-time 300 "$url" -o "out/$name.mp4"; ls -l "out/$name.mp4"; fi
          done
          cd out && zip -r ../demos.zip . && cd .. && ls -l demos.zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: demo-videos
          path: demos.zip
