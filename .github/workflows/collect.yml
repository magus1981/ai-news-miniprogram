name: AI News Collection Pipeline

on:
  # 定时触发改由生产服务器 crontab 调 API 发起（每天 07:35/09:05/11:05/14:05/20:05 北京时间，
  # 2026-08-09 早班提前到 7:35 采美国工作日隔夜新闻；2026-08-10 新增 9:05 轮赶上国内源早间发布）：
  # GitHub 自带 cron 对新加入的 schedule 不可靠（实测 2026-08-04 三轮全部漏跑），
  # 服务器触发更可控；保留 workflow_dispatch 支持手动补跑
  workflow_dispatch: # 支持手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./pipeline
        run: npm install

      # curl-impersonate（Chrome TLS指纹）：机器之心WAF 2026-08-07起按TLS指纹拦截
      # OpenSSL curl（含Actions自带的），必须用Chrome指纹才能过；下载失败降级用系统curl
      - name: Setup curl-impersonate
        working-directory: ./pipeline
        run: |
          mkdir -p bin
          curl -sfL --retry 2 -o /tmp/ci.tar.gz https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz \
            && tar -xzf /tmp/ci.tar.gz -C bin \
            && chmod +x bin/* 2>/dev/null || true
          if [ -x bin/curl_chrome119 ]; then echo "[OK] curl_chrome119 ready"; else echo "[WARN] curl-impersonate setup failed, fallback to system curl"; fi

      # 采集前先从生产服务器拉取当前库：Actions 每次是全新工作区，
      # 没有历史库就会从空库采集，推送后把服务器历史抹掉。
      # 拉取失败（服务器不可达/无数据）时降级为空库，继续往下走。
      - name: Pull current DB from production
        run: |
          mkdir -p data
          curl -sf -H "x-sync-token: ${{ secrets.SYNC_TOKEN }}" \
            -o data/articles.db "${{ secrets.SYNC_URL }}/api/sync-download" \
            && echo "[OK] DB pulled: $(ls -lh data/articles.db | awk '{print $5}')" \
            || echo "[WARN] pull failed, starting from empty DB"

      # 中途报错（如导语生成超时）不阻断推送——已入库的数据照样同步；
      # 服务器侧有防误清库保护（新库条数<现有一半会被拒收）
      - name: Run collection pipeline
        working-directory: ./pipeline
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # 备用代理（当前机器之心已改用curl-impersonate直连，暂不启用）
          # PROXY_URL: ${{ secrets.SYNC_URL }}
          # PROXY_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: node collect.mjs || echo "[WARN] pipeline exited with error, pushing current DB state"

      - name: Push DB to production
        working-directory: ./pipeline
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: node sync-push.mjs
