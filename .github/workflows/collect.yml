name: AI News Collection Pipeline

on:
  # 定时触发改由生产服务器 crontab 调 API 发起（每天 07:35/09:05/11:05/14:05/20:05/23:35 北京时间，
  # 2026-08-09 早班提前到 7:35 采美国工作日隔夜新闻；2026-08-10 新增 9:05 轮赶上国内源早间发布；
  # 2026-08-16 新增 23:35 轮：美国白天=北京晚间，此前 20:05→次日07:35 空窗导致海外重磅稿漏收；
  # 2026-08-27 新增 02:35/05:35 凌晨轻量轮（dispatch inputs.mode=light，
  # 经 COLLECT_MODE 环境变量传给 collect.mjs，只抓海外源）：覆盖美西工作时段，
  # 重磅稿入库延迟从最多12h+压到4h内。注：client_payload 实测被 API 422 拒绝
  # （未声明 inputs 的 workflow 不接受该键），故用声明式 inputs）：
  # GitHub 自带 cron 对新加入的 schedule 不可靠（实测 2026-08-04 三轮全部漏跑），
  # 服务器触发更可控；保留 workflow_dispatch 支持手动补跑
  workflow_dispatch: # 支持手动触发
    inputs:
      mode:
        description: 'light=凌晨轻量轮(只抓海外源)；full=全量42源'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - light

jobs:
  collect:
    # 2026-09-14 数据竞态修复：本 workflow 是"整库 pull → 就地改 → 整库 push"，
    # 两轮一旦重叠，后推者会拿自己那份旧快照把先推者已入库的新增整个覆盖掉
    # （服务器 crontab 每天 7 轮，单轮耗时逼近上限时就会撞车）。
    # 用作业级串行锁排队执行；cancel-in-progress 必须为 false —— 取消在跑的一轮
    # 等于把那轮的抓取和 LLM 花费全扔掉。
    concurrency:
      group: collect-db
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 2026-08-11 信源扩到41个后单轮耗时逼近20分钟，14:05轮在总结阶段被超时杀掉
    # （已筛出的6条当日新闻随job被杀丢失），放宽到35分钟。
    # 2026-09-14 补充：job 级超时是硬杀，被杀时后续步骤一概不执行，
    # 光给推送步加 if: always() 救不了这条路径——真正的丢数据根因在这里。
    # 现改为 step 内用 timeout 主动收尾（见 Run collection pipeline），
    # job 上限留到 40min，给推送和网络余量。
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./pipeline
        run: npm install

      # curl-impersonate（Chrome TLS指纹）：机器之心WAF 2026-08-07起按TLS指纹拦截
      # OpenSSL curl（含Actions自带的），必须用Chrome指纹才能过；下载失败降级用系统curl
      - name: Setup curl-impersonate
        working-directory: ./pipeline
        run: |
          mkdir -p bin
          curl -sfL --retry 2 -o /tmp/ci.tar.gz https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz \
            && tar -xzf /tmp/ci.tar.gz -C bin \
            && chmod +x bin/* 2>/dev/null || true
          if [ -x bin/curl_chrome119 ]; then echo "[OK] curl_chrome119 ready"; else echo "[WARN] curl-impersonate setup failed, fallback to system curl"; fi

      # 采集前先从生产服务器拉取当前库：Actions 每次是全新工作区，
      # 没有历史库就会从空库采集，推送后把服务器历史抹掉。
      # 拉取失败（服务器不可达/无数据）时降级为空库，继续往下走。
      - name: Pull current DB from production
        run: |
          mkdir -p data
          curl -sf -H "x-sync-token: ${{ secrets.SYNC_TOKEN }}" \
            -o data/articles.db "${{ secrets.SYNC_URL }}/api/sync-download" \
            && echo "[OK] DB pulled: $(ls -lh data/articles.db | awk '{print $5}')" \
            || echo "[WARN] pull failed, starting from empty DB"

      # 资料库存档不再整包拉回（2026-09-04）：fetch-content.mjs 写存档是纯增量写入
      # （按URL哈希建目录，从不读旧条目），sync-push.mjs 推送前对照服务器
      # /api/archive-manifest 只增量打包新目录，服务器端逐目录合并、不动存量。
      # 整包拉回-回传的旧机制已废弃（276MB/轮全量上传不再发生）

      # 中途报错（如导语生成超时）不阻断推送——已入库的数据照样同步；
      # 服务器侧有防误清库保护（新库条数<现有一半会被拒收）
      - name: Run collection pipeline
        working-directory: ./pipeline
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          COLLECT_MODE: ${{ github.event.inputs.mode || 'full' }}
          # 国内IP中继（2026-08-29）：zj.gov.cn 等国内政务站拒绝海外IP（Actions直连fetch failed），
          # 浙江爬虫直连失败后经生产服务器 /api/proxy 代拉（见 cn-relay.mjs）。
          # 与机器之心的 PROXY_URL 刻意分开命名：后者会整体切换 jiqizhixin 抓取路径，勿启用
          CN_RELAY_URL: ${{ secrets.SYNC_URL }}
          CN_RELAY_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # 备用代理（当前机器之心已改用curl-impersonate直连，暂不启用）
          # PROXY_URL: ${{ secrets.SYNC_URL }}
          # PROXY_TOKEN: ${{ secrets.SYNC_TOKEN }}
        # step 内主动收尾（2026-09-14）：33 分钟发 SIGTERM 让 collect.mjs 退出，
        # 已提交的增量行留在本地库里，紧接着 if: always() 的推送步仍把这一轮成果推上生产。
        # 旧行为是 job 被 timeout 硬杀 → 本地库连同已筛好的稿件一起消失（8-11 丢 6 条）。
        # 加工质量闸门告警（2026-09-28 修复）：不再用 `|| echo` 吞掉退出码。
        # collect.mjs 在"有半成品被隔离"或"未捕获异常"时置 exitCode=1 → 本步骤标红触发通知。
        # 主列表数据已由代码保证干净，隔离表留存待重跑；推送步 if:always() 仍会推已入库的干净数据，
        # 服务端 sync-upload 有"新库<老库一半即 409 拒收"防误清守卫，故标红不影响安全推送。
        run: |
          set +e
          timeout --preserve-status 33m node collect.mjs
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "[FAIL] 采集/加工环节告警退出 rc=$rc —— 详见上方 [ALERT]；首页主列表已保证无半成品，失败条目已入隔离表待重跑。"
          fi
          exit "$rc"

      - name: Push DB to production
        # 前一步失败/超时也照推：服务端 sync-upload 有"新库条数 < 老库一半即 409 拒收"
        # 的防误清守卫，空工作区误推会被拒，不会覆盖生产
        if: always()
        working-directory: ./pipeline
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: node sync-push.mjs
